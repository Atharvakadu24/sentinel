# ==============================================================================
# Sentinel — Local Development Docker Compose Environment
# ==============================================================================
# Purpose: Provides local PostgreSQL 16 database for Sentinel API and Worker development.
#
# Usage:
#   docker compose up -d postgres    # Start local database container
#   docker compose ps               # Check service status and healthcheck
#   docker compose down             # Stop containers (preserves volume data)
#
# NOTE: The credentials below are intended STRICTLY for local offline development.
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinel_user
      POSTGRES_PASSWORD: sentinel_dev_password
      POSTGRES_DB: sentinel_db
    ports:
      - "5432:5432"
    volumes:
      - sentinel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel_user -d sentinel_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  sentinel_pgdata:
    name: sentinel_pgdata
